<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fragmentos</title>

<style>

html,body{

    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

body{

    font-family:Arial, sans-serif;
}

#bg{

    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
}

#canvas{

    position:fixed;
    inset:0;
}

#title{

    position:fixed;

    top:50px;
    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.25);

    letter-spacing:10px;

    text-transform:uppercase;

    font-size:14px;

    pointer-events:none;
}

#message{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:18px;

    text-align:center;

    letter-spacing:5px;

    pointer-events:none;

    transition:1s;
}

.hide{

    opacity:0;
}

</style>

</head>

<body>

<div id="bg"></div>

<canvas id="canvas"></canvas>

<div id="title">
Fragmentos
</div>

<div id="message">
TOCA LA PANTALLA
</div>

<script>

const images = [

"img/01.jpg",
"img/02.jpg",
"img/03.jpg",
"img/04.jpg",
"img/05.jpg",
"img/06.jpg",
"img/07.jpg"

];

const selected =
images[Math.floor(Math.random()*images.length)];

document.getElementById("bg")
.style.backgroundImage =
`url('${selected}')`;

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

    ctx.fillStyle =
    "rgba(0,0,0,0.95)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);

let firstTouch = false;

function reveal(x,y){

    ctx.globalCompositeOperation =
    "destination-out";

    for(let i=0;i<80;i++){

        const angle =
        Math.random()*Math.PI*2;

        const distance =
        Math.random()*120;

        const radius =
        20 + Math.random()*100;

        const px =
        x + Math.cos(angle)*distance;

        const py =
        y + Math.sin(angle)*distance;

        const g =
        ctx.createRadialGradient(
            px,py,0,
            px,py,radius
        );

        g.addColorStop(
            0,
            "rgba(0,0,0,1)"
        );

        g.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = g;

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function interact(x,y){

    if(!firstTouch){

        firstTouch = true;

        document
        .getElementById("message")
        .classList
        .add("hide");
    }

    reveal(x,y);
}

canvas.addEventListener(
    "click",
    function(e){

        interact(
            e.clientX,
            e.clientY
        );
    }
);

canvas.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        const t =
        e.changedTouches[0];

        interact(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);

</script>

</body>
</html>
